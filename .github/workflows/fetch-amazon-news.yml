name: Fetch Amazon official news

on:
  schedule:
    # Beijing 08:00 / 14:00 / 20:00
    - cron: '0 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: amazon-official-news-fetch
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Discover official updates
        run: node scripts/fetch-amazon-news.js
      - name: Run tests
        shell: bash
        run: |
          for test in tests/*.test.js; do
            node "$test"
          done
      - name: Commit candidate/state changes only
        shell: bash
        run: |
          if git diff --quiet -- data/incoming-news.json data/news-source-state.json; then
            echo "No candidate or source-state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/incoming-news.json data/news-source-state.json
          git commit -m "chore: refresh Amazon news candidates"
          git push
